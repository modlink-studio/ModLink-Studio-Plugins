name: Publish Official Driver Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Plugin identifier to publish
        required: true
        type: string
      release_tag:
        description: Existing plugin release tag, for example plugin-host-camera-v0.2.0rc2
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'plugin-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve plugin target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [[ "$tag" =~ ^plugin-(.+)-v[^/]+$ ]]; then
              plugin_id="${BASH_REMATCH[1]}"
            else
              echo "Unsupported plugin release tag: $tag" >&2
              exit 1
            fi
          else
            tag="${{ inputs.release_tag }}"
            plugin_id="${{ inputs.plugin_id }}"
          fi
          if [ -z "$plugin_id" ]; then
            echo "Plugin id must not be empty." >&2
            exit 1
          fi
          if [[ "$tag" != plugin-${plugin_id}-v* ]]; then
            echo "Release tag '$tag' does not match plugin id '$plugin_id'." >&2
            exit 1
          fi
          plugin_dir="plugins/$plugin_id"
          if [ ! -d "$plugin_dir" ]; then
            echo "Plugin directory does not exist: $plugin_dir" >&2
            exit 1
          fi
          if [ ! -f "$plugin_dir/pyproject.toml" ]; then
            echo "Plugin metadata file is missing: $plugin_dir/pyproject.toml" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "plugin_id=$plugin_id" >> "$GITHUB_OUTPUT"
          echo "plugin_dir=$plugin_dir" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        run: git checkout "${{ steps.target.outputs.tag }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Build plugin wheel
        run: |
          rm -rf dist/plugins
          mkdir -p "dist/plugins/${{ steps.target.outputs.plugin_id }}"
          uv build "${{ steps.target.outputs.plugin_dir }}" -o "dist/plugins/${{ steps.target.outputs.plugin_id }}"

      - name: Upload plugin wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wheel in "dist/plugins/${{ steps.target.outputs.plugin_id }}"/*.whl; do
            gh release upload "${{ steps.target.outputs.tag }}" "$wheel" --clobber
          done
